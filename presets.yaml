  is_builtin: true
  planner_model: gemini-4-neon
  coder_model: qwen2.5-coder:14b
  reviewer_models:
  - gemini-4-neon
  use_solutions_db: false
  use_dag_planner: false
  use_prompt_compression: true
  cross_review_depth: 0
  strict_ast_test_gates: false
  parallel_review: false
