name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Syntax and py_compile check
      run: |
        python -m py_compile main.py core/*.py core/drivers/*.py core/protocol/*.py desktop/*.py

    - name: Run MCP and Gateway PyTest Suite
      env:
        PYTHONPATH: .
      run: |
        pip install pytest pytest-asyncio
        python -m pytest tests/ -v
