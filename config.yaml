version: "1.2.0"

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1

browser:
  headless: true
  user_data_dir: "./browser_profile"
  provider: "gemini" # gemini | chatgpt | claude | deepseek | qwen | grok | mock
  timeout_seconds: 60

models:
  default: "gemini-advanced"
  available:
    - id: "gemini-advanced"
      name: "Google Gemini Advanced (Thinking & Web)"
      provider: "gemini"
    - id: "gemini-2.5-flash"
      name: "Google Gemini 2.5 Flash"
      provider: "gemini"
    - id: "gpt-4o"
      name: "OpenAI GPT-4o (ChatGPT Plus)"
      provider: "chatgpt"
    - id: "gpt-4o-mini"
      name: "OpenAI GPT-4o Mini (Free / Plus)"
      provider: "chatgpt"
    - id: "chatgpt-plus"
      name: "OpenAI ChatGPT Plus"
      provider: "chatgpt"
    - id: "claude-3-7-sonnet"
      name: "Anthropic Claude 3.7 Sonnet (Thinking)"
      provider: "claude"
    - id: "claude-pro"
      name: "Anthropic Claude Pro"
      provider: "claude"
    - id: "deepseek-chat"
      name: "DeepSeek V3 (Chat)"
      provider: "deepseek"
    - id: "deepseek-reasoner"
      name: "DeepSeek R1 (DeepThink)"
      provider: "deepseek"
    - id: "qwen-max"
      name: "Alibaba Qwen Max"
      provider: "qwen"
    - id: "qwen-coder"
      name: "Alibaba Qwen 2.5 Coder"
      provider: "qwen"
    - id: "qwq"
      name: "Alibaba Qwen QwQ"
      provider: "qwen"
    - id: "grok-3"
      name: "xAI Grok 3"
      provider: "grok"
    - id: "grok-3-mini"
      name: "xAI Grok 3 Mini"
      provider: "grok"
    - id: "mock-test"
      name: "Zero-Copy Mock Engine (Instant Test)"
      provider: "mock"

obsidian:
  enabled: true
  vault_path: ""

ux:
  inject_model_signature: true
  header_attribution: true
  hide_inactive_models: true
  display_names_override: {}

cascade:
  max_rework_iterations: 2
  enable_local_gate: true
  enable_architect_audit: true
  hard_gate_cmd: "python -m py_compile"
  mode: "auto"
  planner:
    primary: "gemini-4-neon"
    fallback_order:
      - "deepseek-reasoner"
      - "claude-3-7-sonnet"
      - "gemini-advanced"
  coder:
    primary: "qwen2.5-coder:14b"
    fallback_order:
      - "qwen-coder"
      - "deepseek-chat"
      - "gpt-4o"
  reviewer:
    primary: "gemini-4-neon"
    fallback_order:
      - "chatgpt-plus"
      - "grok-3"
      - "claude-3-7-sonnet"
  fallback_order:
    - "gemini"
    - "deepseek"
    - "qwen"
    - "chatgpt"
    - "grok"
    - "claude"
    - "ollama"
